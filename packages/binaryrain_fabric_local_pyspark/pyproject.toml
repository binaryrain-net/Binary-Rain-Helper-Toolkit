[project]
name = "binaryrain-fabric-local-pyspark"
version = "0.1.0"
description = "This tool can be used for local fabric development by providing a local caching layer to reduce capacity usage."
readme = "README.md"
authors = [{ name = "Binary Rain" }, { name = "Marcel T.O" }]
requires-python = ">=3.12"
dependencies = []

keywords = [
    "binary rain",
    "common",
    "help",
    "functions",
    "data processing",
    "fabric",
    "local",
    "pyspark",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://binaryrain-net.github.io/Binary-Rain-Helper-Toolkit/"

[tool.ruff]
# Extend the settings from the ruff.toml file.
extend = "../../ruff.toml"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
