[project]
name = "binaryrain-fabric-local-pyspark"
version = "0.1.1"
description = "This tool can be used for local fabric development by providing a local caching layer to reduce capacity usage."
readme = "README.md"
authors = [{ name = "Binary Rain" }, { name = "Marcel T.O" }]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-storage-file-datalake>=12.26.0",
    "deltalake>=1.6.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pycryptodome>=3.24.1",
    "pyodbc>=5.3.0",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

keywords = [
    "binary rain",
    "common",
    "help",
    "functions",
    "data processing",
    "fabric",
    "local",
    "pyspark",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://binaryrain-net.github.io/Binary-Rain-Helper-Toolkit/"

[tool.ruff]
# Extend the settings from the ruff.toml file.
extend = "../../ruff.toml"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
