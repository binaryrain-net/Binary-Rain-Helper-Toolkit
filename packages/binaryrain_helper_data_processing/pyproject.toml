[project]
name = "binaryrain-helper-data-processing"
version = "1.1.4"
description = "Aims to simplify and help with commonly used functions in the data processing areas."
readme = "README.md"
authors = [{ name = "Binary Rain" }, { name = "Marcel T.O" }]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

keywords = [
    "binary rain",
    "common",
    "help",
    "functions",
    "data processing",
    "dataframe",
    "excel",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://binaryrain-net.github.io/Binary-Rain-Helper-Toolkit/"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
# Extend the settings from the ruff.toml file.
extend = "../../ruff.toml"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:Could not infer format, so each element will be parsed individually, falling back to `dateutil`.:UserWarning",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
